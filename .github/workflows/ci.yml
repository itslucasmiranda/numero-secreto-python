name: Testes Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verificar sintaxe
        run: python -m compileall -q numero_secreto.py tests
      - name: Executar testes
        run: python -m unittest discover -s tests -v
